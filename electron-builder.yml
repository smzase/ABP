appId: net.anibt.publish
productName: AniBT Publish
copyright: Copyright © 2026
directories:
  output: release
  buildResources: build
files:
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!docs/*'
  - '!{.workbuddy,.github,scripts,build}/**'
  - '!{AGENTS.md,CLAUDE.md,README.md,eslint.config.mjs,components.json}'
  - 'out/**'
  - 'package.json'
asar: true
# Electron 默认会把 50 MiB 左右的全部 Chromium 界面语言包复制进每个产物。
# 应用自己的语言由 Vue i18n 提供，只保留系统菜单/Chromium 需要的三种语言。
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
# 平衡体积与解压速度；AppImage 启动也需要读取压缩内容。
compression: normal
afterPack: scripts/verify-package.cjs
npmRebuild: false
# 全部依赖打包进 out/，dependencies 为空 → asar 内没有 node_modules
win:
  signAndEditExecutable: false
  signtoolOptions:
    sign: false
  target:
    - nsis
    - portable
nsis:
  # 保留小字典、非固实压缩。Setup 与 portable 共用归档，后者每次启动都要解压。
  differentialPackage: true
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: AniBT Publish
  artifactName: ${productName}-${version}-windows-${arch}-Setup.${ext}
portable:
  artifactName: ${productName}-${version}-windows-${arch}-portable.${ext}
mac:
  electronLanguages:
    - en
    - zh_CN
    - zh_TW
  artifactName: ${productName}-${version}-macos-${arch}.${ext}
  identity: null
  notarize: false
  category: public.app-category.utilities
  target:
    - dmg
    - zip
linux:
  category: Utility
  maintainer: smzase <clsmzase@gmail.com>
  target:
    - AppImage
    - deb
appImage:
  compression: gzip
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
