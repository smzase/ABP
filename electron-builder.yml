appId: net.anibt.publish
productName: AniBT Publish
copyright: Copyright © 2026
directories:
  output: release
  buildResources: build
files:
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!docs/*'
  - '!{.workbuddy,.github,scripts,build}/**'
  - '!{AGENTS.md,CLAUDE.md,README.md,eslint.config.js,components.json}'
  - 'out/**'
  - 'package.json'
asar: true
afterPack: scripts/verify-package.cjs
npmRebuild: false
# 全部依赖打包进 out/，dependencies 为空 → asar 内没有 node_modules
win:
  signAndEditExecutable: false
  signtoolOptions:
    sign: false
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: AniBT Publish
  artifactName: ${productName}-${version}-windows-${arch}-Setup.${ext}
portable:
  artifactName: ${productName}-${version}-windows-${arch}-portable.${ext}
mac:
  artifactName: ${productName}-${version}-macos-${arch}.${ext}
  identity: null
  notarize: false
  category: public.app-category.utilities
  target:
    - dmg
    - zip
linux:
  category: Utility
  maintainer: smzase <clsmzase@gmail.com>
  target:
    - AppImage
    - deb
appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
