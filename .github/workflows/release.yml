name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 全量依赖只用于构建，产物只含 out/ + package.json（见 electron-builder.yml files 白名单），
      # node_modules 不会进安装包。
      - run: npm ci

      - run: npm run lint
        continue-on-error: true

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Package (Windows: NSIS + 单文件 portable)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - name: Package (macOS: dmg + zip)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --publish never

      - name: Package (Linux: AppImage + deb)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      # 只上传打包产物（exe / dmg / zip / AppImage / deb），不含任何源码或 node_modules
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anibt-publish-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: anibt-publish-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.exe
            *.dmg
            *.zip
            *.AppImage
            *.deb
            *.blockmap
            latest*.yml
          generate_release_notes: true
