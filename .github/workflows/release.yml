name: Build Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
          - os: macos-15
            platform: mac
          - os: ubuntu-24.04
            platform: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # 全量依赖只用于构建，产物只含 out/ + package.json（见 electron-builder.yml files 白名单），
      # node_modules 不会进安装包。
      - run: npm ci --no-audit --no-fund

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # 当前真窗口探针与产物冒烟脚本使用 Windows 的配置目录和 exe 路径。
      - name: Test Windows UI
        if: runner.os == 'Windows'
        run: npm run probe

      # pack:* 脚本都显式带 --publish never，不创建或更新 GitHub Releases。
      - name: Package ${{ matrix.platform }}
        run: npm run pack:${{ matrix.platform }}

      - name: Smoke test Windows artifact
        if: runner.os == 'Windows'
        run: npm run smoke

      # 只上传打包产物（exe / dmg / zip / AppImage / deb），不含任何源码或 node_modules
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anibt-publish-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
