name: Build Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            arch: x64
          - os: windows-11-arm
            platform: win
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # 全量依赖只用于构建，产物只含 out/ + package.json（见 electron-builder.yml files 白名单），
      # node_modules 不会进安装包。
      - run: npm ci --no-audit --no-fund

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # 当前真窗口探针与产物冒烟脚本使用 Windows 的配置目录和 exe 路径。
      - name: Test Windows UI
        if: runner.os == 'Windows'
        # 覆盖 Windows runner 关闭系统动画的环境；探针内部显式测试两种动态效果偏好。
        run: npm run probe -- --force-prefers-reduced-motion

      # pack:* 脚本都显式带 --publish never，不创建或更新 GitHub Releases。
      - name: Package ${{ matrix.platform }} ${{ matrix.arch }}
        run: npm run pack:${{ matrix.platform }} -- --${{ matrix.arch }}

      - name: Smoke test Windows artifact
        if: runner.os == 'Windows'
        env:
          ABP_SMOKE_ARCH: ${{ matrix.arch }}
        run: npm run smoke

      # 每个 Artifact 只收录一个平台、架构和包类型的文件。
      - name: Upload Windows portable
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v7
        with:
          path: release/*-windows-${{ matrix.arch }}-portable.exe
          if-no-files-found: error
          archive: false
          retention-days: 14

      - name: Upload Windows Setup
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v7
        with:
          path: release/*-windows-${{ matrix.arch }}-Setup.exe
          if-no-files-found: error
          archive: false
          retention-days: 14

      - name: Upload macOS DMG
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v7
        with:
          path: release/*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          archive: false
          retention-days: 14

      - name: Upload macOS ZIP
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v7
        with:
          path: release/*-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          archive: false
          retention-days: 14

      - name: Upload Linux AppImage
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          path: release/*-linux-*.AppImage
          if-no-files-found: error
          archive: false
          retention-days: 14

      - name: Upload Linux DEB
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          path: release/*-linux-*.deb
          if-no-files-found: error
          archive: false
          retention-days: 14
